<svg viewBox="0 0 1200 965" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="965" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Cron Jobs &amp; Reconciliation — Coverage &amp; The Copy-Pasted Cron Bug</text>
  <text x="600" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">InstantMudra Enterprises Admin Portal</text>

  <!-- SECTION A -->
  <text x="600" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#2c3e50">Reconciliation cron coverage by domain</text>

  <rect x="30" y="90" width="216" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="138" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">AEPS</text>
  <text x="138" y="130" text-anchor="middle" font-size="9.5" fill="#7f1d1d">No reconciliation cron</text>
  <text x="138" y="144" text-anchor="middle" font-size="9.5" fill="#7f1d1d">exists at all</text>

  <rect x="255" y="90" width="216" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="363" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">DMT</text>
  <text x="363" y="130" text-anchor="middle" font-size="9.5" fill="#7f1d1d">No reconciliation cron</text>
  <text x="363" y="144" text-anchor="middle" font-size="9.5" fill="#7f1d1d">exists at all</text>

  <rect x="480" y="90" width="216" height="60" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="588" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">PG</text>
  <text x="588" y="130" text-anchor="middle" font-size="9.5" fill="#78350f">Runs (buggy cron) —</text>
  <text x="588" y="144" text-anchor="middle" font-size="9.5" fill="#78350f">result discarded, inert</text>

  <rect x="705" y="90" width="216" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="813" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Payout</text>
  <text x="813" y="130" text-anchor="middle" font-size="9.5" fill="#166534">Runs (buggy cron) —</text>
  <text x="813" y="144" text-anchor="middle" font-size="9.5" fill="#166534">persists, partial vendor cover.</text>

  <rect x="930" y="90" width="240" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1050" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Recharge / BBPS / BillAvenue</text>
  <text x="1050" y="130" text-anchor="middle" font-size="9.5" fill="#166534">Recharge: runs correctly, persists</text>
  <text x="1050" y="144" text-anchor="middle" font-size="9.5" fill="#166534">BillAvenue: runs hourly, separate cron</text>

  <!-- SECTION B: copy-pasted cron bug -->
  <text x="600" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">⚠ Three reconciliation schedulers share one copy-pasted, buggy cron expression</text>

  <rect x="30" y="198" width="360" height="96" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="46" y="220" font-size="10.5" font-weight="700" fill="#92400e">PgCheckStatusScheduler</text>
  <text x="46" y="238" font-size="9.7" font-family="Consolas, monospace" fill="#78350f">cron = "0 */59 * * * *"</text>
  <text x="46" y="254" font-size="9.5" fill="#78350f">// comment says "every 59 minutes"</text>
  <text x="46" y="270" font-size="9.5" fill="#78350f">Actual: fires at minute :00 AND :59 —</text>
  <text x="46" y="285" font-size="9.5" fill="#78350f">twice per hour, 1 minute apart</text>

  <rect x="420" y="198" width="360" height="96" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="436" y="220" font-size="10.5" font-weight="700" fill="#92400e">PayoutCheckStatusScheduler</text>
  <text x="436" y="238" font-size="9.7" font-family="Consolas, monospace" fill="#78350f">cron = "0 */59 * * * *"</text>
  <text x="436" y="254" font-size="9.5" fill="#78350f">// comment says "every 10 minutes"</text>
  <text x="436" y="270" font-size="9.5" fill="#78350f">Identical expression, different wrong</text>
  <text x="436" y="285" font-size="9.5" fill="#78350f">comment — copy-pasted, not fixed</text>

  <rect x="810" y="198" width="360" height="96" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="826" y="220" font-size="10.5" font-weight="700" fill="#92400e">BBPSRechargeCheckStatusScheduler</text>
  <text x="826" y="238" font-size="9.7" font-family="Consolas, monospace" fill="#78350f">cron = "0 */59 * * * *"</text>
  <text x="826" y="254" font-size="9.5" fill="#78350f">// comment says "every 5 minutes"</text>
  <text x="826" y="270" font-size="9.5" fill="#78350f">Same identical expression again,</text>
  <text x="826" y="285" font-size="9.5" fill="#78350f">a third different wrong comment</text>

  <rect x="30" y="306" width="1140" height="40" rx="6" fill="#eef2f7" stroke="#2c3e50" stroke-width="2"/>
  <text x="600" y="330" text-anchor="middle" font-size="10.3" fill="#1a1a1a">*/n in a cron minute field (range 0-59) means "0, n, 2n, …" within range — */59 yields only {0, 59}, i.e. two firings clustered near the top of each hour, never the evenly-spaced interval any of the three comments describe.</text>

  <!-- SECTION C: PG inert -->
  <text x="600" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">PG reconciliation is completely inert</text>

  <rect x="30" y="392" width="1140" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="46" y="414" font-size="10.3" font-family="Consolas, monospace" fill="#7f1d1d">PgStatusResponse vendorResponse = initiator.checkStatus(orderId);</text>
  <text x="46" y="432" font-size="10.3" font-family="Consolas, monospace" font-weight="700" fill="#991b1b">// — nothing else. Not persisted, not compared, not forwarded to the transaction engine.</text>
  <text x="46" y="456" font-size="10" fill="#7f1d1d">PGOrchestrator.checkStatusForPendingTransactions() calls the vendor's status API for every PENDING transaction,</text>
  <text x="46" y="472" font-size="10" fill="#7f1d1d">assigns the response to a local variable, and the method ends. The call happens (twice an hour, per the bug above) —</text>
  <text x="46" y="486" font-size="10" fill="#7f1d1d">the result has zero effect on any transaction's state.</text>

  <!-- SECTION D: Payout/Recharge working -->
  <text x="600" y="530" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c3e50">Payout &amp; Recharge reconciliation — properly wired, partial vendor coverage</text>

  <rect x="30" y="544" width="560" height="130" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="46" y="566" font-size="10.5" font-weight="700" fill="#166534">Both persist the finalized status AND forward to</text>
  <text x="46" y="582" font-size="10.5" font-weight="700" fill="#166534">TransactionEngineServiceImpl.processTransaction()</text>
  <text x="46" y="602" font-size="9.5" fill="#166534">PayoutOrchestrator.checkStatusForPendingTransactions()</text>
  <text x="46" y="617" font-size="9.5" fill="#166534">and RechargeStatusScheduler.checkPendingTransactions()</text>
  <text x="46" y="632" font-size="9.5" fill="#166534">both: call vendor status API → map response → save new</text>
  <text x="46" y="647" font-size="9.5" fill="#166534">status → build DTO → hand off to the central transaction</text>
  <text x="46" y="662" font-size="9.5" fill="#166534">engine. This is the correct shape — a real contrast to PG.</text>

  <rect x="610" y="544" width="560" height="130" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="626" y="566" font-size="10.5" font-weight="700" fill="#92400e">Payout coverage gated by VendorStatusChecker</text>
  <text x="626" y="584" font-size="9.5" fill="#78350f">5 of 7 payout vendor impls implement the marker interface:</text>
  <text x="626" y="599" font-size="9.5" fill="#78350f">NixaSoft, RunPaisa, Unisus, VimoPay, Slpe ✓</text>
  <text x="626" y="617" font-size="9.5" font-weight="700" fill="#92400e">RazorpayPayoutServiceImpl and ShadvalPayoutServiceImpl</text>
  <text x="626" y="632" font-size="9.5" font-weight="700" fill="#92400e">do NOT — their pending transactions are silently skipped</text>
  <text x="626" y="647" font-size="9.5" fill="#78350f">(getVendorStatusChecker() returns null → continue,</text>
  <text x="626" y="662" font-size="9.5" fill="#78350f">just a log.warn(), no escalation) every cron run.</text>

  <!-- SECTION E: dead code -->
  <rect x="30" y="694" width="1140" height="80" rx="6" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="716" font-size="10.5" font-weight="700" fill="#334155">RechargeStatusScheduler — minor dead code + another stale comment</text>
  <text x="46" y="734" font-size="9.5" fill="#475569">Two overloads of getVendorCredentials() exist — only the String subProductId version is ever called; the</text>
  <text x="46" y="749" font-size="9.5" fill="#475569">RechargeTransaction-typed overload is dead. Two @Autowired VendorCredentialsRepository fields under different names.</text>
  <text x="46" y="764" font-size="9.5" fill="#475569">Comment says "Runs every 30 seconds" on a job whose actual cron is */5 (every 5 minutes) — correct cron, wrong comment.</text>

  <!-- SECTION F: report schedulers -->
  <rect x="30" y="790" width="1140" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="46" y="812" font-size="10.5" font-weight="700" fill="#166534">Report schedulers (5 files) — comparatively well-formed</text>
  <text x="46" y="830" font-size="9.5" fill="#166534">HourlyReportScheduler, TransactionReportScheduler, WalletHistoryReportScheduler, WalletPreviewReportScheduler,</text>
  <text x="46" y="843" font-size="9.5" fill="#166534">ChargeCommissionReportScheduler — each has its own distinct, correct cron expression; no copy-paste bug found here.</text>

  <!-- Legend -->
  <rect x="30" y="890" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="51" y="901" font-size="10.5" fill="#475569">Correctly implemented</text>

  <rect x="260" y="890" width="14" height="14" rx="3" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="281" y="901" font-size="10.5" fill="#475569">Flagged bug / partial coverage</text>

  <rect x="520" y="890" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="541" y="901" font-size="10.5" fill="#475569">Severe — inert or missing entirely</text>

  <rect x="820" y="890" width="14" height="14" rx="3" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="841" y="901" font-size="10.5" fill="#475569">Minor / dead code</text>

  <text x="600" y="940" text-anchor="middle" font-size="10" fill="#94a3b8">Generated from source review — InstantMudra Enterprises Admin Portal — module 7 of the architecture documentation set</text>
</svg>
