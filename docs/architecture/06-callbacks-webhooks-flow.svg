<svg viewBox="0 0 1200 1195" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1195" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Callbacks &amp; Webhooks — Whitelist Coverage &amp; Processing Gaps</text>
  <text x="600" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">InstantMudra Enterprises Admin Portal</text>

  <!-- SECTION A -->
  <text x="600" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#2c3e50">Callback endpoint inventory — AESFilter whitelist status (String.startsWith() semantics, per Module 4)</text>

  <!-- Table header -->
  <rect x="30" y="90" width="1140" height="28" fill="#2c3e50"/>
  <text x="46" y="109" font-size="10" font-weight="700" fill="#fff">Controller</text>
  <text x="330" y="109" font-size="10" font-weight="700" fill="#fff">Endpoint</text>
  <text x="820" y="109" font-size="10" font-weight="700" fill="#fff">Whitelist status</text>

  <!-- PG rows (all covered - green) -->
  <g font-size="9.5">
    <rect x="30" y="118" width="1140" height="26" fill="#f0fdf4"/>
    <text x="46" y="135" fill="#1a1a1a">PGCallbackController</text>
    <text x="330" y="135" font-family="Consolas, monospace" fill="#1a1a1a">/api/pg/callback/runpaisa</text>
    <text x="820" y="135" fill="#166534">✓ covered — exact match</text>

    <rect x="30" y="144" width="1140" height="26" fill="#ffffff"/>
    <text x="46" y="161" fill="#1a1a1a">PGCallbackController</text>
    <text x="330" y="161" font-family="Consolas, monospace" fill="#1a1a1a">/api/pg/callback/unisus</text>
    <text x="820" y="161" fill="#166534">✓ covered — exact match</text>

    <rect x="30" y="170" width="1140" height="26" fill="#f0fdf4"/>
    <text x="46" y="187" fill="#1a1a1a">PGCallbackController</text>
    <text x="330" y="187" font-family="Consolas, monospace" fill="#1a1a1a">/api/pg/callback/nixasoft</text>
    <text x="820" y="187" fill="#166534">✓ covered — exact match</text>

    <rect x="30" y="196" width="1140" height="26" fill="#ffffff"/>
    <text x="46" y="213" fill="#1a1a1a">PGCallbackController</text>
    <text x="330" y="213" font-family="Consolas, monospace" fill="#1a1a1a">/api/pg/callback/slpe</text>
    <text x="820" y="213" fill="#166534">✓ covered — exact match</text>

    <rect x="30" y="222" width="1140" height="26" fill="#f0fdf4"/>
    <text x="46" y="239" fill="#1a1a1a">PGCallbackController</text>
    <text x="330" y="239" font-family="Consolas, monospace" fill="#1a1a1a">/api/pg/callback/razorpay</text>
    <text x="820" y="239" fill="#166534">✓ covered — exact match</text>

    <rect x="30" y="248" width="1140" height="26" fill="#ffffff"/>
    <text x="46" y="265" fill="#1a1a1a">PGCallbackController</text>
    <text x="330" y="265" font-family="Consolas, monospace" fill="#1a1a1a">/api/pg/callback/cashfree</text>
    <text x="820" y="265" fill="#166534">✓ covered — exact match</text>

    <rect x="30" y="274" width="1140" height="26" fill="#f0fdf4"/>
    <text x="46" y="291" fill="#1a1a1a">PGCallbackController</text>
    <text x="330" y="291" font-family="Consolas, monospace" fill="#1a1a1a">/api/pg/callback/im</text>
    <text x="820" y="291" fill="#166534">✓ covered — exact match</text>

    <!-- Payout rows -->
    <rect x="30" y="300" width="1140" height="26" fill="#ffffff"/>
    <text x="46" y="317" fill="#1a1a1a">PayoutCallbackController</text>
    <text x="330" y="317" font-family="Consolas, monospace" fill="#1a1a1a">/api/payout/callback/runpaisa</text>
    <text x="820" y="317" fill="#166534">✓ covered — exact + prefix</text>

    <rect x="30" y="326" width="1140" height="26" fill="#f0fdf4"/>
    <text x="46" y="343" fill="#1a1a1a">PayoutCallbackController</text>
    <text x="330" y="343" font-family="Consolas, monospace" fill="#1a1a1a">/api/payout/callback/nixasoft</text>
    <text x="820" y="343" fill="#166534">✓ covered — via bare "/api/payout/callback" prefix</text>

    <rect x="30" y="352" width="1140" height="26" fill="#ffffff"/>
    <text x="46" y="369" fill="#1a1a1a">PayoutCallbackController</text>
    <text x="330" y="369" font-family="Consolas, monospace" fill="#1a1a1a">/api/payout/callback/slpe</text>
    <text x="820" y="369" fill="#166534">✓ covered — via bare prefix</text>

    <rect x="30" y="378" width="1140" height="26" fill="#f0fdf4"/>
    <text x="46" y="395" fill="#1a1a1a">PayoutCallbackController</text>
    <text x="330" y="395" font-family="Consolas, monospace" fill="#1a1a1a">/api/payout/callback/vimopay</text>
    <text x="820" y="395" fill="#166534">✓ covered — exact + prefix</text>

    <rect x="30" y="404" width="1140" height="26" fill="#ffffff"/>
    <text x="46" y="421" fill="#1a1a1a">PayoutCallbackController</text>
    <text x="330" y="421" font-family="Consolas, monospace" fill="#1a1a1a">/api/payout/callback/im</text>
    <text x="820" y="421" fill="#166534">✓ covered — exact + prefix</text>
  </g>

  <!-- Missing rows - red -->
  <rect x="30" y="430" width="1140" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="46" y="450" font-size="9.5" fill="#7f1d1d">PayoutCallbackController</text>
  <text x="330" y="450" font-size="9.5" font-family="Consolas, monospace" font-weight="700" fill="#991b1b">/api/payout/unisus-callback</text>
  <text x="820" y="450" font-size="9.5" font-weight="700" fill="#991b1b">✗ NOT covered — different path shape, no prefix matches</text>

  <rect x="30" y="462" width="1140" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="46" y="482" font-size="9.5" fill="#7f1d1d">RechargeCallbackController</text>
  <text x="330" y="482" font-size="9.5" font-family="Consolas, monospace" font-weight="700" fill="#991b1b">/api/recharge/callback</text>
  <text x="820" y="482" font-size="9.5" font-weight="700" fill="#991b1b">✗ NOT covered — zero whitelist entries for /api/recharge/*</text>

  <!-- SECTION B: prefix nuance -->
  <rect x="30" y="508" width="1140" height="80" rx="6" fill="#eef2f7" stroke="#2c3e50" stroke-width="2"/>
  <text x="46" y="530" font-size="10.5" font-weight="700" fill="#1a1a1a">Prefix-matching nuance (built on the Module 4 correction)</text>
  <text x="46" y="548" font-size="9.5" fill="#334155">The bare whitelist entry "/api/payout/callback" alone covers every "/api/payout/callback/*" sub-path under AESFilter's</text>
  <text x="46" y="563" font-size="9.5" fill="#334155">String.startsWith() matching — the specific per-vendor entries next to it are redundant. But "/api/payout/unisus-callback"</text>
  <text x="46" y="578" font-size="9.5" fill="#334155">has a different path shape (no "/callback" segment), so no entry — specific or prefix — covers it.</text>
  <text x="46" y="563" font-size="9.5" fill="#334155">String.startsWith() matching — the specific per-vendor entries next to it are redundant. But "/api/payout/unisus-callback"</text>

  <!-- SECTION C: signature verification -->
  <text x="600" y="608" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c3e50">Signature verification — inconsistent, and disabled where present</text>

  <rect x="30" y="622" width="560" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="46" y="644" font-size="10.5" font-weight="700" fill="#991b1b">Cashfree — check exists, is commented out</text>
  <text x="46" y="662" font-size="9.5" fill="#7f1d1d">boolean isValid = verifySignature(...); // commented out</text>
  <text x="46" y="678" font-size="9.5" fill="#7f1d1d">log.info("SIGNATURE VERIFIED"); // logged regardless,</text>
  <text x="46" y="694" font-size="9.5" fill="#7f1d1d">unconditionally, whether or not it actually was</text>
  <text x="46" y="712" font-size="9.5" fill="#7f1d1d">(top-level finding — confirmed directly in source)</text>

  <rect x="610" y="622" width="560" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="626" y="644" font-size="10.5" font-weight="700" fill="#991b1b">Razorpay — signature captured, never checked</text>
  <text x="626" y="662" font-size="9.5" fill="#7f1d1d">razorpay_signature is accepted as a request param and</text>
  <text x="626" y="678" font-size="9.5" fill="#7f1d1d">passed to RazorPayPGServiceImpl.processCallback(),</text>
  <text x="626" y="694" font-size="9.5" fill="#7f1d1d">but no verification logic references it anywhere in that</text>
  <text x="626" y="712" font-size="9.5" fill="#7f1d1d">file — a dead parameter, not a disabled check.</text>

  <rect x="30" y="734" width="1140" height="40" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="758" text-anchor="middle" font-size="10" fill="#92400e">RunPaisa (the default/most-used PG vendor) — zero signature/HMAC/checksum verification anywhere in RunpaisaPGServiceImpl</text>

  <!-- SECTION D: CallbackParserFactory -->
  <text x="600" y="810" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c3e50">CallbackParserFactory — a RunPaisa-shaped abstraction, RunPaisa-only in practice</text>

  <rect x="30" y="824" width="1140" height="110" rx="6" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="846" font-size="10.3" fill="#334155">VendorCallbackParser.parse(payload) returns <tspan font-family="Consolas, monospace" font-weight="700">RunPaisaCallback</tspan> specifically — the interface itself is shaped around</text>
  <text x="46" y="863" font-size="10.3" fill="#334155">RunPaisa's response, even though CashfreeCallbackParser and RazorpayCallbackParser also implement it.</text>
  <text x="46" y="885" font-size="10.3" font-weight="700" fill="#92400e">Confirmed by direct search: CallbackParserFactory.getParser() is called from exactly one place — RunpaisaPGServiceImpl.</text>
  <text x="46" y="902" font-size="10.3" fill="#92400e">Cashfree and Razorpay's actual webhook handlers (processWebhook() / processCallback()) never call the factory at all —</text>
  <text x="46" y="919" font-size="10.3" fill="#92400e">their CallbackParser implementations are registered Spring beans that nothing ever selects.</text>

  <!-- SECTION E: idempotency + async -->
  <text x="600" y="962" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c3e50">Duplicate delivery &amp; failure handling</text>

  <rect x="30" y="976" width="560" height="110" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="46" y="998" font-size="10.3" font-weight="700" fill="#92400e">Idempotency: 1 of ~11 callback endpoints</text>
  <text x="46" y="1016" font-size="9.5" fill="#78350f">IdempotencyServiceUtil (real, DB-unique-constraint-</text>
  <text x="46" y="1031" font-size="9.5" fill="#78350f">backed) protects only the Cashfree PG callback.</text>
  <text x="46" y="1049" font-size="9.5" fill="#78350f">Its own key header is optional (required = false) —</text>
  <text x="46" y="1064" font-size="9.5" fill="#78350f">a vendor retry that omits it bypasses the guard even</text>
  <text x="46" y="1079" font-size="9.5" fill="#78350f">on this one protected path.</text>

  <rect x="610" y="976" width="560" height="110" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="626" y="998" font-size="10.3" font-weight="700" fill="#92400e">Async failures are silently swallowed</text>
  <text x="626" y="1016" font-size="9.5" fill="#78350f">UnisusCallbackAsyncProcessor.processAsync() runs</text>
  <text x="626" y="1031" font-size="9.5" fill="#78350f">@Async, after the controller already returned 200 OK.</text>
  <text x="626" y="1049" font-size="9.5" fill="#78350f">Its entire body is wrapped in try/catch with an explicit</text>
  <text x="626" y="1064" font-size="9.5" fill="#78350f">"// DO NOT THROW" — any downstream lookup failure</text>
  <text x="626" y="1079" font-size="9.5" fill="#78350f">leaves the transaction stuck, silently, with no retry.</text>

  <!-- Legend -->
  <rect x="30" y="1114" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="51" y="1125" font-size="10.5" fill="#475569">Whitelisted / covered</text>

  <rect x="220" y="1114" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="241" y="1125" font-size="10.5" fill="#475569">Not covered / disabled check — confirmed gap</text>

  <rect x="530" y="1114" width="14" height="14" rx="3" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="551" y="1125" font-size="10.5" fill="#475569">Flagged risk</text>

  <rect x="700" y="1114" width="14" height="14" rx="3" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="721" y="1125" font-size="10.5" fill="#475569">Dead / unreachable code</text>

  <text x="600" y="1170" text-anchor="middle" font-size="10" fill="#94a3b8">Generated from source review — InstantMudra Enterprises Admin Portal — module 6 of the architecture documentation set</text>
</svg>
