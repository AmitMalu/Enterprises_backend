<svg viewBox="0 0 1200 1250" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1250" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Wallets &amp; Ledger — Table Layout &amp; Balance Update Flow</text>
  <text x="600" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">Smart Credit Solution Enterprises Admin Portal</text>

  <!-- SECTION A -->
  <text x="600" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#2c3e50">32 physical wallet tables — no shared table, one pair per level × wallet type</text>

  <g font-size="9">
    <rect x="115" y="90" width="130" height="46" rx="6" fill="#2c3e50"/>
    <text x="180" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">AD</text>
    <text x="180" y="124" text-anchor="middle" fill="#cbd5e1">Prepaid + Postpaid</text>

    <rect x="255" y="90" width="130" height="46" rx="6" fill="#2c3e50"/>
    <text x="320" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ET</text>
    <text x="320" y="124" text-anchor="middle" fill="#cbd5e1">Prepaid + Postpaid</text>

    <rect x="395" y="90" width="130" height="46" rx="6" fill="#2c3e50"/>
    <text x="460" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">WL</text>
    <text x="460" y="124" text-anchor="middle" fill="#cbd5e1">Prepaid + Postpaid</text>

    <rect x="535" y="90" width="130" height="46" rx="6" fill="#2c3e50"/>
    <text x="600" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">SD</text>
    <text x="600" y="124" text-anchor="middle" fill="#cbd5e1">Prepaid + Postpaid</text>

    <rect x="675" y="90" width="130" height="46" rx="6" fill="#2c3e50"/>
    <text x="740" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">PT</text>
    <text x="740" y="124" text-anchor="middle" fill="#cbd5e1">Prepaid + Postpaid</text>

    <rect x="815" y="90" width="130" height="46" rx="6" fill="#166534"/>
    <text x="880" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">DT</text>
    <text x="880" y="124" text-anchor="middle" fill="#dcfce7">+ Gullak</text>

    <rect x="955" y="90" width="130" height="46" rx="6" fill="#166534"/>
    <text x="1020" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RT</text>
    <text x="1020" y="124" text-anchor="middle" fill="#dcfce7">+ Gullak</text>
  </g>

  <rect x="30" y="150" width="1140" height="52" rx="6" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="171" text-anchor="middle" font-size="10.5" fill="#334155">7 levels × 2 wallet types (Prepaid, Postpaid) = 14 balance tables, + Gullak only for DT &amp; RT (+2) = 16 balance tables</text>
  <text x="600" y="188" text-anchor="middle" font-size="10.5" fill="#334155">— each mirrored by a matching *TransactionDetails ledger table = <tspan font-weight="700">32 physical tables total</tspan>, no shared table</text>

  <!-- SECTION B -->
  <text x="600" y="228" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c3e50">Two @MappedSuperclasses exist — but subclasses re-declare the same fields anyway</text>

  <rect x="30" y="242" width="560" height="120" rx="8" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="264" font-size="12.5" font-weight="700" fill="#1a1a1a">AbstractWalletAmountTable</text>
  <text x="46" y="280" font-size="9.5" fill="#475569">(@MappedSuperclass, lives in the dto/ package)</text>
  <text x="46" y="300" font-size="10" fill="#475569">• totalCash, availableBalance, usedCash,</text>
  <text x="58" y="315" font-size="10" fill="#475569">lastUpdatedAmount, lastUpdatedDate, lastUpdatedTime</text>
  <text x="46" y="335" font-size="10" fill="#475569">• Extended by all 16 *Amount entities</text>
  <text x="46" y="350" font-size="10" fill="#475569">  (RetailerPrepaidAmount, DistributorGullakAmount, …)</text>

  <rect x="610" y="242" width="560" height="120" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="626" y="264" font-size="12.5" font-weight="700" fill="#92400e">⚠ Every subclass re-declares the same fields</text>
  <text x="626" y="284" font-size="10" fill="#78350f">e.g. RetailerPrepaidAmount extends AbstractWalletAmountTable,</text>
  <text x="626" y="299" font-size="10" fill="#78350f">then re-declares totalCash / usedCash / availableBalance /</text>
  <text x="626" y="314" font-size="10" fill="#78350f">lastUpdatedAmount / lastUpdatedDate / lastUpdatedTime again</text>
  <text x="626" y="329" font-size="10" fill="#78350f">with its own @Column mappings, plus extras (cutOfAmount, remark)</text>
  <text x="626" y="349" font-size="10" fill="#78350f">→ the shared base class exists but isn't actually relied on</text>

  <!-- SECTION C -->
  <text x="600" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c3e50">Table/column name resolution — CommonMethods (fixed switch, not request input)</text>

  <rect x="30" y="405" width="1140" height="34" rx="17" fill="#2c3e50"/>
  <text x="600" y="427" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fff">getEntityName(hierarchyType) — switch → "admin" / "enterprises" / "white_label" / "super_distributor" / "partner" / "distributor" / "retailer" / "retailer_user"</text>
  <line x1="600" y1="439" x2="600" y2="457" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="30" y="457" width="1140" height="34" rx="6" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="479" text-anchor="middle" font-size="10" fill="#334155">getAmountTable() / getTransactionTable(type, walletType) → "{prefix}_{wallet}_amount" / "{prefix}_{wallet}_transaction_details"</text>

  <rect x="30" y="501" width="700" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="46" y="518" font-size="9.7" fill="#166534">✓ Explicit code comment on the native-SQL call site:</text>
  <text x="46" y="533" font-size="9.7" fill="#166534">"amountTable and columnName must only come from trusted internal mappings — never accept from request"</text>

  <rect x="750" y="501" width="420" height="40" rx="6" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="766" y="518" font-size="9.7" fill="#334155">Sub-users have no wallet of their own —</text>
  <text x="766" y="533" font-size="9.7" fill="#334155">resolved to their parent's wallet before every read:</text>

  <rect x="30" y="553" width="360" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="210" y="577" text-anchor="middle" font-size="10" fill="#334155">RU → parent Retailer's wallet (RT)</text>

  <rect x="410" y="553" width="360" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="590" y="577" text-anchor="middle" font-size="10" fill="#334155">AU → parent Admin's wallet (AD)</text>

  <rect x="790" y="553" width="380" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="980" y="577" text-anchor="middle" font-size="10" fill="#334155">WLAU → parent Whitelabel's wallet (WL)</text>

  <!-- SECTION D -->
  <text x="600" y="625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c3e50">Balance update path — plain read, compute in Java, plain write. No locking anywhere.</text>

  <rect x="80" y="638" width="340" height="46" rx="6" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="250" y="657" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">getCurrentBalance()</text>
  <text x="250" y="673" text-anchor="middle" font-size="9" fill="#64748b">native SELECT available_balance — no lock</text>

  <line x1="420" y1="661" x2="460" y2="661" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="460" y="638" width="290" height="46" rx="6" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="605" y="657" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Java computes</text>
  <text x="605" y="673" text-anchor="middle" font-size="9" fill="#64748b">newBalance = current ± amount</text>

  <line x1="750" y1="661" x2="790" y2="661" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="790" y="638" width="330" height="46" rx="6" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="955" y="657" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">DynamicWalletRepository.updateWallet()</text>
  <text x="955" y="673" text-anchor="middle" font-size="9" fill="#64748b">plain UPDATE — no WHERE balance check, no version col</text>

  <rect x="80" y="696" width="1040" height="34" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="717" text-anchor="middle" font-size="10" fill="#92400e">⚠ Classic read-then-write race — confirmed no SELECT…FOR UPDATE / @Lock / version column anywhere in this path</text>

  <rect x="80" y="740" width="1040" height="46" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="759" text-anchor="middle" font-size="10" fill="#92400e">FundingServiceImpl bulk upload: Executors.newFixedThreadPool(...) + CompletableFuture.supplyAsync(...) run this exact</text>
  <text x="600" y="775" text-anchor="middle" font-size="10" fill="#92400e">read-compute-write sequence concurrently across many rows — the race is not just theoretical, it's actively parallelized</text>

  <!-- SECTION E: CRITICAL -->
  <text x="600" y="822" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">⚠ CRITICAL — confirmed bug: multi-level reversal corrupts non-retailer wallets</text>
  <text x="600" y="840" text-anchor="middle" font-size="10" fill="#7f1d1d">TransactionEngineServiceImpl — manual transaction status flip from SUCCESS to FAILURE</text>

  <rect x="30" y="852" width="1140" height="140" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="46" y="874" font-size="10.3" fill="#7f1d1d">1. wallet = getWalletByType(walletType, retailerId) — fetched <tspan font-weight="700">ONCE</tspan>, for the retailer only, before any loop</text>
  <text x="46" y="892" font-size="10.3" fill="#7f1d1d">2. Loop runs over all 7 levels: retailer, distributor, partner, super_distributor, white_label, enterprises, admin</text>
  <text x="46" y="910" font-size="10.3" fill="#7f1d1d">3. For every level's transaction record: <tspan font-weight="700">currentBalance = wallet.getAvailableBalance()</tspan> — still the retailer's</text>
  <text x="60" y="926" font-size="10.3" fill="#7f1d1d">snapshot from step 1, never re-fetched per level</text>
  <text x="46" y="944" font-size="10.3" fill="#7f1d1d">4. newBalance is computed from that wrong base and written <tspan font-weight="700">directly</tspan> into that level's real amount table via</text>
  <text x="60" y="960" font-size="10.3" fill="#7f1d1d">dynamicWalletRepository.updateWallet() — a blind UPDATE, no arithmetic done in SQL</text>
  <text x="46" y="982" font-size="10.7" font-weight="700" fill="#991b1b">Net effect: 6 of the 7 levels in a multi-level commission reversal get their wallet balance overwritten using the</text>

  <rect x="30" y="1000" width="1140" height="46" rx="6" fill="#7f1d1d"/>
  <text x="600" y="1021" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">RETAILER's balance as the arithmetic base — not their own. This silently corrupts distributor / partner /</text>
  <text x="600" y="1038" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">super-distributor / white-label / enterprises / admin wallet balances on every SUCCESS→FAILURE flip.</text>

  <!-- SECTION F -->
  <rect x="30" y="1066" width="1140" height="66" rx="6" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="1088" font-size="10.5" font-weight="700" fill="#334155">DynamicTransactionRepositoryImpl.getBalance() / .updateBalance() — dead code, wrong columns</text>
  <text x="46" y="1105" font-size="9.5" fill="#475569">References transaction_id / balance / hierarchy_id — columns that don't exist on the real amount tables (which use</text>
  <text x="46" y="1120" font-size="9.5" fill="#475569">retailer_id / available_balance etc.). Verified unused anywhere in the codebase — would fail immediately if ever called.</text>

  <!-- Legend -->
  <rect x="30" y="1160" width="14" height="14" rx="3" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="51" y="1171" font-size="10.5" fill="#475569">Standard structure</text>

  <rect x="190" y="1160" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="211" y="1171" font-size="10.5" fill="#475569">Good practice, verified</text>

  <rect x="380" y="1160" width="14" height="14" rx="3" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="401" y="1171" font-size="10.5" fill="#475569">Flagged risk / concurrency gap</text>

  <rect x="600" y="1160" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="621" y="1171" font-size="10.5" fill="#475569">Critical — confirmed correctness bug</text>

  <text x="600" y="1210" text-anchor="middle" font-size="10" fill="#94a3b8">Generated from source review — Smart Credit Solution Enterprises Admin Portal — module 3 of the architecture documentation set</text>
</svg>
