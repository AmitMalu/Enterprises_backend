<svg viewBox="0 0 1200 1460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1460" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Core / Bootstrap &amp; Config — Application Startup Flow</text>
  <text x="600" y="56" text-anchor="middle" font-size="13" fill="#64748b">Smart Credit Solution Enterprises Admin Portal</text>

  <!-- Node: JVM Start -->
  <rect x="410" y="76" width="380" height="42" rx="21" fill="#2c3e50"/>
  <text x="600" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">JVM Start → AdminApplication.main()</text>
  <line x1="600" y1="118" x2="600" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: SSLUtil warning -->
  <rect x="380" y="150" width="440" height="60" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">SSLUtil.disableSSL()</text>
  <text x="600" y="193" text-anchor="middle" font-size="11.5" fill="#92400e">⚠ Disables TLS cert/hostname verification JVM-wide, before context loads</text>
  <line x1="600" y1="210" x2="600" y2="242" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: SpringApplication.run -->
  <rect x="440" y="242" width="320" height="42" rx="21" fill="#2c3e50"/>
  <text x="600" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">SpringApplication.run()</text>
  <line x1="600" y1="284" x2="600" y2="312" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Section: Profile & Properties -->
  <text x="600" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Profile &amp; Properties Resolution</text>

  <rect x="60" y="344" width="340" height="76" rx="8" fill="#f4f6f8" stroke="#cbd5e1"/>
  <text x="230" y="365" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">application.properties (base)</text>
  <text x="230" y="382" text-anchor="middle" font-size="10.5" fill="#475569">port 8081, context /adminPortal,</text>
  <text x="230" y="397" text-anchor="middle" font-size="10.5" fill="#475569">vendor keys, ddl-auto=update</text>

  <rect x="430" y="344" width="340" height="76" rx="8" fill="#f4f6f8" stroke="#cbd5e1"/>
  <text x="600" y="365" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">spring.profiles.active=uat</text>
  <text x="600" y="382" text-anchor="middle" font-size="10.5" fill="#475569">→ application-uat.properties</text>
  <text x="600" y="397" text-anchor="middle" font-size="10.5" fill="#475569">(or -prod for production)</text>

  <rect x="800" y="344" width="340" height="76" rx="8" fill="#f4f6f8" stroke="#cbd5e1"/>
  <text x="970" y="365" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">spring.profiles.include=swagger</text>
  <text x="970" y="382" text-anchor="middle" font-size="10.5" fill="#475569">→ application-swagger.properties</text>
  <text x="970" y="397" text-anchor="middle" font-size="10.5" fill="#475569">(Swagger ON in every profile)</text>

  <!-- converge lines -->
  <line x1="230" y1="420" x2="600" y2="460" stroke="#475569" stroke-width="2"/>
  <line x1="600" y1="420" x2="600" y2="460" stroke="#475569" stroke-width="2"/>
  <line x1="970" y1="420" x2="600" y2="460" stroke="#475569" stroke-width="2"/>
  <line x1="600" y1="460" x2="600" y2="492" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: Context init -->
  <rect x="360" y="492" width="480" height="42" rx="21" fill="#2c3e50"/>
  <text x="600" y="518" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Spring ApplicationContext Initialization</text>
  <line x1="600" y1="534" x2="600" y2="562" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="600" y="580" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3e50">config/ package — @Configuration beans instantiated</text>

  <!-- Grid of config beans: 3 cols x 4 rows, cell 380x90, gap 15 -->
  <!-- Row 0 y=598 -->
  <!-- col x: 15, 410, 805 -->

  <!-- (0,0) SecurityConfig - risk + CORS#1 -->
  <rect x="15" y="598" width="380" height="92" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <rect x="330" y="606" width="56" height="18" rx="9" fill="#dc2626"/>
  <text x="358" y="619" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">CORS #1</text>
  <text x="30" y="622" font-size="12.5" font-weight="700" fill="#92400e">SecurityConfig</text>
  <text x="30" y="640" font-size="10" fill="#78350f">Filter chain permits anyRequest()</text>
  <text x="30" y="655" font-size="10" fill="#78350f">⚠ debug filter logs Authorization</text>
  <text x="30" y="670" font-size="10" fill="#78350f">header to stdout</text>

  <!-- (0,1) CorsFilterConfig -->
  <rect x="410" y="598" width="380" height="92" rx="8" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="725" y="606" width="56" height="18" rx="9" fill="#dc2626"/>
  <text x="753" y="619" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">CORS #2</text>
  <text x="425" y="622" font-size="12.5" font-weight="700" fill="#1a1a1a">CorsFilterConfig</text>
  <text x="425" y="640" font-size="10" fill="#475569">14 hardcoded origins</text>
  <text x="425" y="655" font-size="10" fill="#475569">Order.HIGHEST_PRECEDENCE filter</text>

  <!-- (0,2) WebConfig -->
  <rect x="805" y="598" width="380" height="92" rx="8" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="1120" y="606" width="56" height="18" rx="9" fill="#dc2626"/>
  <text x="1148" y="619" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">CORS #3</text>
  <text x="820" y="622" font-size="12.5" font-weight="700" fill="#1a1a1a">WebConfig</text>
  <text x="820" y="640" font-size="10" fill="#475569">CORS mapping + static handler</text>
  <text x="820" y="655" font-size="10" fill="#475569">/images/** → /opt/scs/uploads/</text>

  <!-- Row 1 y=705 -->
  <!-- (1,0) WebSocketConfig -->
  <rect x="15" y="705" width="380" height="92" rx="8" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="330" y="713" width="56" height="18" rx="9" fill="#dc2626"/>
  <text x="358" y="726" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">CORS #4</text>
  <text x="30" y="729" font-size="12.5" font-weight="700" fill="#1a1a1a">WebSocketConfig</text>
  <text x="30" y="747" font-size="10" fill="#475569">STOMP broker /topic, /app</text>
  <text x="30" y="762" font-size="10" fill="#475569">/ws endpoint, own origin list</text>

  <!-- (1,1) WebSocketAuthConfig - risk -->
  <rect x="410" y="705" width="380" height="92" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="425" y="729" font-size="12.5" font-weight="700" fill="#92400e">WebSocketAuthConfig</text>
  <text x="425" y="747" font-size="10" fill="#78350f">Tags STOMP session with hierarchyId</text>
  <text x="425" y="762" font-size="10" fill="#78350f">⚠ token not decrypted/validated</text>

  <!-- (1,2) CryptoConfig - risk -->
  <rect x="805" y="705" width="380" height="92" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="820" y="729" font-size="12.5" font-weight="700" fill="#92400e">CryptoConfig</text>
  <text x="820" y="747" font-size="10" fill="#78350f">VidualPay AES key/IV bean</text>
  <text x="820" y="762" font-size="10" fill="#78350f">⚠ hardcoded sandbox credentials</text>

  <!-- Row 2 y=812 -->
  <!-- (2,0) AESKeyService -->
  <rect x="15" y="812" width="380" height="92" rx="8" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="30" y="836" font-size="12.5" font-weight="700" fill="#1a1a1a">AESKeyService</text>
  <text x="30" y="854" font-size="10" fill="#475569">PBKDF2 key derivation</text>
  <text x="30" y="869" font-size="10" fill="#475569">8 hardcoded per-hierarchy salts</text>

  <!-- (2,1) RestTemplateConfig -->
  <rect x="410" y="812" width="380" height="92" rx="8" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="425" y="836" font-size="12.5" font-weight="700" fill="#1a1a1a">RestTemplateConfig</text>
  <text x="425" y="854" font-size="10" fill="#475569">Shared RestTemplate bean</text>
  <text x="425" y="869" font-size="10" fill="#475569">10s connect / 30s read timeout</text>

  <!-- (2,2) SwaggerConfig -->
  <rect x="805" y="812" width="380" height="92" rx="8" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="820" y="836" font-size="12.5" font-weight="700" fill="#1a1a1a">SwaggerConfig</text>
  <text x="820" y="854" font-size="10" fill="#475569">OpenAPI metadata + bearer scheme</text>
  <text x="820" y="869" font-size="10" fill="#475569">adminApi (all) vs clientApi (~25) groups</text>

  <!-- Row 3 y=919 -->
  <!-- (3,0) properties/* beans -->
  <rect x="15" y="919" width="380" height="92" rx="8" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="30" y="943" font-size="12.5" font-weight="700" fill="#1a1a1a">properties/* beans</text>
  <text x="30" y="961" font-size="10" fill="#475569">FileStorageProperties, FileAccessProperties,</text>
  <text x="30" y="976" font-size="10" fill="#475569">ReportProperties — no validation</text>

  <!-- Node: HierarchyMasterDataInitializer -->
  <line x1="600" y1="1011" x2="600" y2="1050" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="1050" width="540" height="66" rx="8" fill="#eef2f7" stroke="#2c3e50" stroke-width="2"/>
  <text x="600" y="1073" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">@PostConstruct: HierarchyMasterDataInitializer</text>
  <text x="600" y="1091" text-anchor="middle" font-size="10.5" fill="#475569">Seeds HierarchyMaster (SA/AD/ET/WL/SD/PT/DT/RT) if table empty — count()==0 guard</text>
  <line x1="600" y1="1116" x2="600" y2="1148" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: enable scheduling etc -->
  <rect x="330" y="1148" width="540" height="42" rx="21" fill="#2c3e50"/>
  <text x="600" y="1174" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">@EnableScheduling / @EnableCaching / @EnableAsync activated</text>
  <line x1="600" y1="1190" x2="600" y2="1222" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Final node -->
  <rect x="300" y="1222" width="600" height="90" rx="10" fill="#16a34a"/>
  <text x="600" y="1252" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Application Ready</text>
  <text x="600" y="1274" text-anchor="middle" font-size="11.5" fill="#ecfdf5">Listening on :8081  •  context-path /adminPortal</text>
  <text x="600" y="1292" text-anchor="middle" font-size="11.5" fill="#ecfdf5">WAR deployable to Tomcat 10.1.34  •  Swagger UI live at /swagger-ui.html</text>

  <!-- Legend -->
  <rect x="15" y="1340" width="14" height="14" rx="3" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="36" y="1351" font-size="11" fill="#475569">Flagged risk / hardcoded secret</text>

  <rect x="255" y="1340" width="14" height="14" rx="3" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="276" y="1351" font-size="11" fill="#475569">Standard config bean</text>

  <rect x="460" y="1340" width="56" height="14" rx="7" fill="#dc2626"/>
  <text x="524" y="1351" font-size="11" fill="#475569">Independently-maintained CORS allowlist (4 total — drifted)</text>

  <text x="600" y="1400" text-anchor="middle" font-size="10" fill="#94a3b8">Generated from source review — Smart Credit Solution Enterprises Admin Portal — module 1 of the architecture documentation set</text>
</svg>
