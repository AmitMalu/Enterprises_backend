# Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=alpha
# springdoc.swagger-ui.tags-sorter=alpha

springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-model-expand-depth=0
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.syntax-highlight.enabled=true

# API Docs
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

# Show all endpoints
springdoc.show-actuator=false

# Load custom JS to auto-inject/handle token
springdoc.swagger-ui.custom-js=/swagger-ui/custom.js

# New: HTTPS Configuration
springdoc.servers[0].url=https://admin1.utsabpay.com/enterprises
springdoc.servers[0].description=Production Server
