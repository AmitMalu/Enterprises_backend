# ============================================================
# Smart Credit Solution demo server (95.134.162.161)
# Activated by -Dspring.profiles.active=demo in Tomcat's setenv.sh.
# The DB password is NOT stored here: Spring reads it from the
# SPRING_DATASOURCE_PASSWORD environment variable set in setenv.sh.
# ============================================================

# Database (MySQL on the same server)
spring.datasource.url=jdbc:mysql://localhost:3306/smartcredit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&rewriteBatchedStatements=true
spring.datasource.username=smartcredit_app
spring.jpa.show-sql=false

# Sandbox vendor endpoints (same as UAT) so the demo never moves real money
runpaisa.base.url=https://dev.api.runpaisa.com
runpaisa.create.order.url=https://test.api.pg.runpaisa.com/order
runpaisa.order.status.url=https://test.api.pg.runpaisa.com/status
payout.base.url=https://dev.api.bbps.v1.runpaisa.com/payout

# Public URLs: admin1 = admin portal, portal1 = retailer portal (both on this server).
# The old sslip.io address is kept so existing links keep working during the switch.
app.cors.extra-origins=https://admin1.utsabpay.com,https://portal1.utsabpay.com,https://95-134-162-161.sslip.io
app.portal.base-url=https://portal1.utsabpay.com/enterprise
app.admin.login-url=https://admin1.utsabpay.com/admin/login
# Login URLs must contain one of these to pass the admin / white-label domain check
app.login.allowed-domains=.utsabpay.com,.sslip.io

# Demo accounts only: mobiles starting with this prefix always get this OTP (sales demos, no SMS needed).
# All other mobiles get a normal random OTP. Remove both lines before real customers use this server.
app.demo.fixed-otp=123456
app.demo.otp-mobile-prefixes=90000000

# Uploaded files and white-label branding assets
file.upload.base-dir=/opt/scs/uploads
file.access.base-url=https://admin1.utsabpay.com/enterprises/images/
file.access.config-assets-path=/wl-assets
reports.base-dir=/opt/scs/reports/Hourly_Reports

# Swagger "Try it out" server
springdoc.servers[0].url=https://admin1.utsabpay.com/enterprises
springdoc.servers[0].description=Smart Credit demo server
